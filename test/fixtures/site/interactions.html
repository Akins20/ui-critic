<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactions</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #111; background: #fff; }
  .skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; background: #fff; outline: 2px solid #5a3ec8; }
  main { padding: 16px; display: grid; gap: 24px; justify-items: start; }
  button, a { font: inherit; }
  .good { background: #5a3ec8; color: #fff; border: 0; padding: 12px 16px; }
  .good:hover { background: #4a2fb0; }
  .good:focus-visible { outline: 3px solid #f0a; outline-offset: 2px; }
  .silent { background: #eee; color: #111; border: 0; padding: 12px 16px; outline: none; }
  a.flat { color: #1a4bd8; text-decoration: none; }
  a.flat:focus { outline: none; }
  .card { display: block; padding: 16px; border: 1px solid #ddd; color: inherit; text-decoration: none; }
  .card .title { color: #111; }
  .card:hover .title { color: #5a3ec8; text-decoration: underline; }
  .card:focus-visible { box-shadow: 0 0 0 3px #5a3ec8; outline: none; }
  .ghost { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  footer { padding: 16px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <button class="good" type="button">Good button</button>
  <button class="silent" type="button">Silent button</button>
  <a class="flat" href="#nowhere">Flat link</a>
  <a class="card" href="#card"><span class="title">Card title</span><br><span>Card body</span></a>
  <span class="ghost" tabindex="0">Invisible stop</span>
</main>
<footer><a class="good" href="#top" tabindex="0">Footer link</a></footer>
</body>
</html>

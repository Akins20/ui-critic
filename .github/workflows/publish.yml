name: publish

# Publishes the package to npm when a version tag is pushed (v0.2.0, v0.3.0, ...).
# Cut a release with: npm version minor && git push origin main --tags
#
# Two ways to authorise the publish, checked in this order:
#
# 1. Trusted publishing (no token to create, store or rotate): on npmjs.com, open
#    the package, Settings, "Trusted publisher", choose GitHub Actions and enter the
#    owner (Akins20), the repository (ui-critic) and this workflow's file name
#    (publish.yml). npm then accepts a publish from this workflow on the strength of
#    the OIDC token GitHub issues to it (the id-token permission below), and attaches
#    provenance on its own. This needs npm 11.5 or later, hence the upgrade step.
#
# 2. An automation token stored as the NPM_TOKEN repository secret (a granular
#    access token for this package with "bypass 2FA" enabled). Used when present.
#
# With neither in place the publish fails with "need auth", and the release is a
# hand `npm publish` from a checkout of the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: The tag must match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${expected}"
            exit 1
          fi
      - name: Use a current npm (trusted publishing needs 11.5 or later)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Publish with the NPM_TOKEN secret
        if: env.NPM_TOKEN != ''
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          npm publish --provenance --access public
      - name: Publish through trusted publishing
        if: env.NPM_TOKEN == ''
        # Verbose so that a refused OIDC token exchange is visible in the log; at the
        # default level npm says nothing about it and fails with a bare "need auth".
        run: npm publish --access public --loglevel verbose
      - name: What "need auth" means here
        if: failure()
        run: |
          echo "npm asked for a login, so the trusted-publishing token exchange was refused or never attempted."
          echo "On npmjs.com, package Settings, Trusted publisher, check that:"
          echo "  1. Allowed actions includes direct 'npm publish' (publishers created after 2026-09-03 allow only 'npm stage publish' by default);"
          echo "  2. owner is Akins20, repository is ui-critic, workflow filename is publish.yml, and no environment name is set (this job declares none)."
          echo "The verbose log above shows the exchange request and the registry's answer."

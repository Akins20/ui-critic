name: publish

# Publishes the package to npm when a version tag is pushed (v0.2.0, v0.3.0, ...).
# Cut a release with: npm version minor && git push origin main --tags
#
# Two ways to authorise the publish, checked in this order:
#
# 1. Trusted publishing (no token to create, store or rotate): on npmjs.com, open
#    the package, Settings, "Trusted publisher", choose GitHub Actions and enter the
#    owner (Akins20), the repository (ui-critic) and this workflow's file name
#    (publish.yml). npm then accepts a publish from this workflow on the strength of
#    the OIDC token GitHub issues to it (the id-token permission below), and attaches
#    provenance on its own. This needs npm 11.5 or later, hence the upgrade step.
#
# 2. An automation token stored as the NPM_TOKEN repository secret (a granular
#    access token for this package with "bypass 2FA" enabled). Used when present.
#
# With neither in place the publish fails with "need auth", and the release is a
# hand `npm publish` from a checkout of the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: The tag must match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${expected}"
            exit 1
          fi
      - name: Use a current npm (trusted publishing needs 11.5 or later)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Skip when this version is already on the registry
        id: registry
        # A tag that is moved or pushed again re-runs this job; publishing the
        # same version twice is refused by npm, so end quietly instead.
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with the NPM_TOKEN secret
        if: env.NPM_TOKEN != '' && steps.registry.outputs.published != 'true'
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          npm publish --provenance --access public
      - name: Publish through trusted publishing
        if: env.NPM_TOKEN == '' && steps.registry.outputs.published != 'true'
        # Verbose so that a refused OIDC token exchange is visible in the log; at the
        # default level npm says nothing about it and fails with a bare "need auth".
        run: npm publish --access public --loglevel verbose
      # `npx uicritic` runs the tool: the unscoped name ui-critic belongs to another
      # package. The alias is published after the main package, at the same version,
      # and never blocks a release: until its own trusted publisher is set up on
      # npmjs.com (after a first publish by hand), this step reports and moves on.
      - name: Publish the uicritic alias
        continue-on-error: true
        run: |
          node scripts/stamp-alias.mjs
          spec="uicritic@$(node -p "require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already published"
          else
            cd alias/uicritic
            if [ -n "$NPM_TOKEN" ]; then npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"; fi
            npm publish --access public --loglevel verbose || {
              echo "::warning title=uicritic alias::not published. Publish it once by hand (npm publish in alias/uicritic after node scripts/stamp-alias.mjs), then add a trusted publisher for uicritic on npmjs.com"
              exit 1
            }
          fi
      - name: What "need auth" means here
        if: failure()
        run: |
          echo "npm asked for a login, so the trusted-publishing token exchange was refused or never attempted."
          echo "The verbose log above shows the exchange request and the registry's answer. What the answers mean:"
          echo "  'package not found': no trusted-publisher record on npmjs.com matches this workflow's identity."
          echo "     On npmjs.com, package Settings, Trusted publisher, the fields must read exactly:"
          echo "     owner Akins20 (the GitHub login with its capital A, not the npm username), repository ui-critic"
          echo "     (no owner prefix), workflow filename publish.yml (no path), and no environment name (this job declares none)."
          echo "  '403 Forbidden ... OIDC permission denied for this action' on the PUT, after provenance was signed:"
          echo "     the record matches but its allowed actions permit only 'npm stage publish'. A record cannot be edited:"
          echo "     delete the connection and create it again with direct 'npm publish' allowed (records created after"
          echo "     2026-09-03 allow staged publishing only by default)."
          echo "After correcting the record, re-run this job; nothing in the repository needs to change."

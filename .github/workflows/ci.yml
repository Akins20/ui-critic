name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check every module
        run: for f in bin/*.mjs src/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test

  test-node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: for f in bin/*.mjs src/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test

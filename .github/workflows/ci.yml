name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check every module
        run: for f in bin/*.mjs src/*.mjs src/native/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test

  test-node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: for f in bin/*.mjs src/*.mjs src/native/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test

  # The web capture in a real browser, against a fixture site with planted defects.
  # Playwright is installed for this job only; the package itself has no dependencies.
  capture-in-a-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Capture integration test
        run: node --test test/capture.integration.test.mjs
